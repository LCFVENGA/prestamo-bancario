spring.application.name=prestamos-bancarios

# ========== Server Configuration ==========
server.port=8080

# ========== H2 Database Configuration (default for local demo) ==========
spring.datasource.url=${DB_URL:jdbc:h2:mem:prestamos_bancarios;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# ========== JPA & Hibernate ==========
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========== Cache Configuration ==========
spring.cache.type=caffeine
spring.cache.cache-names=loans
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=5m

# ========== Logging ==========
logging.level.org.springframework=INFO
logging.level.com.prestamos_bancarios=DEBUG

security.jwt.secret=${JWT_SECRET:VGhpcy1pcy1hLWxvbmctc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQ=}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

